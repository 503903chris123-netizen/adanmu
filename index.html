function scareStep(dt){
 const near=bots.filter(b=>b.mon&&!b.remote&&b.hp>0).reduce((best,b)=>{const d=Math.hypot(P.x-b.x,P.z-b.z);return !best||d<best.d?{b,d}:best},null);
 if(!near){if(scareNode)scareNode.style.opacity='0';P.scareKill=0;return}
 const d=near.d,level=Math.max(0,Math.min(1,(22-d)/19));
 if(level>.02){const el=getScareNode(),face=el.firstElementChild,text=el.lastElementChild;el.style.opacity=String(Math.min(.88,level*.9));face.style.transform='scale('+(.2+level*.9)+') rotate('+(Math.sin(TT*18)*level*4)+'deg)';text.style.opacity=String(level);if(d<12){scarePulse-=dt;if(scarePulse<=0){scarePulse=Math.max(.16,.8-d*.045);snd({n:.09,f:65+Math.max(0,12-d)*5,t:75,td:.08,v:.22+level*.25,e:1})}}}else if(scareNode)scareNode.style.opacity='0';
 if(d<3.1&&(P.scareCD||0)<=0){P.scareCD=12;P.scareKill=.72;const el=getScareNode();el.style.transition='none';el.style.opacity='1';el.style.background='rgba(90,0,0,.96)';el.firstElementChild.style.transition='none';el.firstElementChild.style.transform='scale(1.55)';el.lastElementChild.textContent=near.b.mt==='nightmare'?'它 找 到 你 了':'抓 到 你 了';snd({n:.8,f:95,t:35,td:.8,v:.75,e:1});setTimeout(()=>{if(scareNode){scareNode.style.transition='opacity .25s';scareNode.style.opacity='0';scareNode.style.background='radial-gradient(ellipse at center,transparent 18%,rgba(100,0,0,.18) 58%,rgba(100,0,0,.78) 100%)';scareNode.firstElementChild.style.transition='transform .25s';}},620)}
 if((P.scareCD||0)>0)P.scareCD=Math.max(0,P.scareCD-dt);
 if(P.scareKill>0){P.scareKill-=dt;if(P.scareKill<=0){P.scareKill=0;hurt(99999,near.b)}}
}

// ---- admin commands (signed with the admin private key, verified by everyone) ----
function applyAdm(c){if(!(c.to==='*'||c.to===UID))return;
 switch(c.a){
 case'set':{const k=c.k,v=+c.v;if(!isFinite(v))break;if(k==='hp')P.hp=Math.max(1,v);else if(k==='ar'){P.ar=Math.max(0,v);if(v>0&&!P.at)P.at=1}else if(k==='spd')P.spdm=Math.max(.1,Math.min(6,v));else if(k==='jm')P.jm=Math.max(.2,Math.min(5,v));else if(k==='dm')P.dm=Math.max(0,v);else if(k==='money')money=Math.max(0,v);else if(k==='god')P.god=v?1:0;else if(k==='inf')P.inf=v?1:0;break}
 case'heal':P.hp=100;P.ar=Math.max(P.ar,[0,50,100][P.at]);break;
 case'kill':{const g=P.god;P.god=0;hurt(99999);P.god=g;break}
 case'gun':{const w=WP[c.k];if(w){P.w=c.k;P.ammo=w.mag;P.res=w.res;P.rl=0;setGun()}break}
 case'tp':if(c.ax!==undefined&&c.to!==UID){if(free(c.ax+1.5,c.az,.5,0))P.x=c.ax+1.5;else P.x=c.ax;P.z=c.az}break;
 case'summon':summon(c.t,Math.max(1,Math.min(20,c.n|0||1)));break;
 case'clr':{bots.filter(b=>b.mon&&!b.remote).forEach(rmBot);bots=bots.filter(b=>!(b.mon&&!b.remote));break}}}
async function admSend(c){if(!ISADM)return;c.ts=Date.now();c.nc=Math.random().toString(36).slice(2,10);c.ax=+P.x.toFixed(2);c.az=+P.z.toFixed(2);const s=JSON.stringify(c);applyAdm(c);if(ONL)try{ONL.emit('adm',{s,f:MYID})}catch(e){}}
async function onAdm(m){try{const d=m.data;if(!d||!d.s||d.f===MYID)return;const sn=RO.on.find(o=>o.id===d.f);if(!sn||sn.u!==ADMIN_ID)return;const c=JSON.parse(d.s);if(Math.abs(Date.now()-c.ts)>120000||SEEN[c.nc])return;SEEN[c.nc]=1;applyAdm(c)}catch(e){}}

// ---- admin panel (only exists for the verified admin) ----
{const st=document.createElement('style');st.textContent='.ar{display:flex;gap:6px;margin:4px 0;align-items:center}.ar span{width:84px}.ai{flex:1;min-width:0;background:#0008;border:1px solid #00e5ff55;color:#fff;padding:5px;font-family:inherit}.ab{padding:5px 9px;border:0;background:linear-gradient(90deg,#ff2e88,#c4165f);color:#fff;font-weight:700;cursor:pointer;font-family:inherit}.as{margin:10px 0 2px;color:#00e5ff;letter-spacing:.2em}';document.head.appendChild(st)}
function buildAdm(){let p=$('adm');if(!p){p=document.createElement('div');p.id='adm';p.style.cssText='position:absolute;right:12px;top:60px;width:min(360px,92vw);max-height:84vh;overflow:auto;display:none;background:#04101aef;border:1px solid #ff2e88aa;padding:12px;z-index:7;font-size:13px;text-align:left;color:#d8f8ff';p.onmousedown=e=>e.stopPropagation();$('w').appendChild(p)}return p}
function toggleAdm(){if(!ISADM||st==='menu')return;const p=buildAdm();ADM_OPEN=p.style.display!=='block';if(ADM_OPEN){document.exitPointerLock();firing=false;renderAdm()}else{p.style.display='none';lock()}}
function renderAdm(){const p=buildAdm();p.style.display='block';const ps=[UID].concat(RO.on.map(o=>o.u)).filter((u,i,a)=>a.indexOf(u)===i),
 sel=(id,o)=>'<select id="'+id+'" class="ai" style="width:100%">'+o+'</select>',
 row=(l,k,v,s)=>'<div class="ar"><span>'+l+'</span><input id="a_'+k+'" class="ai" type="number" value="'+v+'" step="'+(s||1)+'"><button class="ab" data-k="'+k+'">应用</button></div>',
 tOpt='<option value="*">所有人</option>'+ps.map(u=>'<option value="'+hx(u)+'">'+hx(u)+(u===UID?'（自己）':'')+'</option>').join(''),
 gOpt=KEYS.concat(['thunder']).map(k=>'<option value="'+k+'"'+(k==='thunder'?' selected':'')+'>'+WP[k].n+'</option>').join(''),
 mOpt=Object.keys(MT).map(k=>'<option value="'+k+'">'+MT[k].n+'</option>').join('');
 p.innerHTML='<b style="color:#ff2e88;letter-spacing:.2em">⚡ 管理员面板</b><small style="float:right">P 键开关</small><div class="as">目标</div>'+sel('at',tOpt)+'<div class="as">属性</div>'+row('生命值','hp',100)+row('护甲','ar',100)+row('移速倍率','spd',1,.1)+row('跳跃倍率','jm',1,.1)+row('伤害倍率','dm',1,.5)+row('金钱','money',16000,100)
 +'<div class="ar"><button class="ab" data-t="god:1">无敌 开</button><button class="ab" data-t="god:0">无敌 关</button><button class="ab" data-t="inf:1">无限弹药 开</button><button class="ab" data-t="inf:0">关</button></div><div class="ar"><button class="ab" data-x="heal">满血</button><button class="ab" data-x="kill">击杀</button><button class="ab" data-x="tp">拉到我这里</button></div>'
 +'<div class="as">武器</div><div class="ar">'+sel('ag',gOpt)+'<button class="ab" data-x="gun">给予</button></div><div class="as">召唤怪物（追杀目标）</div><div class="ar">'+sel('am',mOpt)+'<input id="an" class="ai" type="number" value="3" min="1" max="20" style="max-width:60px"><button class="ab" data-x="summon">召唤</button></div><div class="ar"><button class="ab" data-x="clr">清除目标的怪物</button></div><div class="st" id="amsg"></div>';
 p.querySelectorAll('.ab').forEach(b=>b.onclick=()=>{const to=$('at').value,d=b.dataset;let c=null;if(d.k)c={a:'set',to,k:d.k,v:+$('a_'+d.k).value};else if(d.t){const q=d.t.split(':');c={a:'set',to,k:q[0],v:+q[1]}}else if(d.x==='heal')c={a:'heal',to};else if(d.x==='kill')c={a:'kill',to};else if(d.x==='tp')c={a:'tp',to};else if(d.x==='gun')c={a:'gun',to,k:$('ag').value};else if(d.x==='summon')c={a:'summon',to,t:$('am').value,n:+$('an').value||1};else if(d.x==='clr')c={a:'clr',to};if(c){admSend(c);$('amsg').textContent='已执行'}})}
function mountAdm(){let b=$('admb');if(!ISADM){if(b)b.remove();const p=$('adm');if(p)p.remove();return}if(!b){b=document.createElement('div');b.id='admb';b.textContent='⚡';b.style.cssText='position:absolute;left:12px;top:214px;width:36px;height:36px;line-height:36px;text-align:center;background:#000a;border:1px solid #ff2e88aa;border-radius:6px;cursor:pointer;font-size:20px;z-index:5;color:#ff2e88;display:none';b.onmousedown=e=>e.stopPropagation();b.onclick=toggleAdm;$('w').appendChild(b)}}

bootAuth();sched();
})();
